
services:
  nginx:
    image: nginx
    container_name: nginx-server
    ports:
      - "81:80"
    volumes:
      - './nginx/nginx.conf:/etc/nginx/nginx.conf'
      - './staticfiles:/usr/share/nginx/html/staticfiles'
      - './media:/usr/share/nginx/html/media/files'
    restart: unless-stopped
    networks:
      - web-network

networks:
  web-network:
    driver: bridge