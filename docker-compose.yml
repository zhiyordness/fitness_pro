
services:
  django:
    build:
      context: .
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
    networks:
      - web-network
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - web-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - web-network
    restart: unless-stopped
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8000:80"
    volumes:
      - './nginx/nginx.conf:/etc/nginx/nginx.conf'
      - './staticfiles:/usr/share/nginx/html/staticfiles'
      - './media:/usr/share/nginx/html/media/files'
    restart: unless-stopped
    networks:
      - web-network
    depends_on:
      - django

networks:
  web-network:
    driver: bridge

volumes:
    postgres_data:
    redis_data:
