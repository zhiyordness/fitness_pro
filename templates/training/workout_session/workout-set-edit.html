{% extends 'common/base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card">

        <div class="card-header">
            Edit Set
        </div>

        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit"
                        class="btn btn-success">

                    Save

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
