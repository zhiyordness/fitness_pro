{% extends 'common/base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header text-center">
                    <h2>Resend Verification Email</h2>
                </div>
                <div class="card-body text-center">
                    <p>Enter your email address below to receive a new verification link.</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_email" class="form-label">Email address:</label>
                            <input type="email" name="email" id="id_email" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary mt-3">Resend Verification Email</button>
                    </form>
                    <p class="mt-3">Already verified? <a href="{% url 'accounts:login' %}">Log in here</a>.</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
