{% extends 'common/base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header text-center">
                    <h2>Reset Your Password</h2>
                </div>
                <div class="card-body">
                    <p>Forgotten your password? Enter your email address below, and we'll email you instructions for setting a new one.</p>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary mt-3">Reset My Password</button>
                        <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-3">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
